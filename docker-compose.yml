version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: unisallround-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: unisallround
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init_db/init_pg.sql:/docker-entrypoint-initdb.d/init.sql

  mysql-db:
    image: mysql:8.0
    container_name: unisallround-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: unisallround
      MYSQL_ROOT_PASSWORD: mysqlroot
      MYSQL_USER: mysqluser
      MYSQL_PASSWORD: mysqlpass
    volumes:
      - mysqldata:/var/lib/mysql
      - ./backend/init_db/init_mysql.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
  mysqldata:
